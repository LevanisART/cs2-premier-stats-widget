<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Stats Widget</title>
  <!--
    The widget now lives at cs2livestats.com. This page just forwards there,
    preserving the full query string (steamId, theme, etc.), so existing OBS /
    Streamlabs browser sources that still point at this old URL keep working and
    automatically show the current widget - no OBS changes needed.
  -->
  <script>
    location.replace('https://cs2livestats.com/widget/' + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0;url=https://cs2livestats.com/widget/">
</head>
<body style="margin:0;background:#111;color:#cbd5e1;font-family:sans-serif">
  <p style="padding:16px">Moved to <a id="go" href="https://cs2livestats.com/widget/" style="color:#8ab4ff">cs2livestats.com</a></p>
  <script>var g=document.getElementById('go');if(g)g.href='https://cs2livestats.com/widget/'+location.search+location.hash;</script>
</body>
</html>
