name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_LEETIFY_KEY: ${{ secrets.VITE_LEETIFY_KEY }}
          # Public URL of the optional Steam avatar proxy Worker (worker/README.md).
          # Not a secret, so a repository variable is the natural home, but a
          # secret with the same name works too.
          VITE_AVATAR_PROXY_URL: ${{ vars.VITE_AVATAR_PROXY_URL || secrets.VITE_AVATAR_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
